name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # keep in sync with the Dockerfile
  JAVA_VERSION: 21
  NDK_VERSION: 25.2.9519653

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgb-lib/bindings/uniffi
          save-if: ${{ github.event_name != 'pull_request' }}

      # the NDK version is pinned, instead of using the one preinstalled on the
      # runner, to build the native libraries the same way the docker image does
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # this builds the native libraries and generates the bindings file
      - name: Build native libraries and bindings
        run: ./gradlew :android:buildAndroidLib

      # the library and the test APK are built in a separate gradle invocation,
      # as they need the files produced by the previous one
      - name: Build library and test APK
        run: ./gradlew :android:assembleRelease :android:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # the smoke test is run on two API levels, as the generated bindings use
      # the Android system cleaner from API level 34 and the JNA one below it
      - name: Run smoke test on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest

      - name: Run smoke test on API 30
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
